<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo de drag & drop</title>
    <link rel="stylesheet" href="estilos.css" />
    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.2.0/dist/confetti.min.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="encabezado">
      <h1 class="encabezado-titulo">Test de informática</h1>
      <h2 class="encabezado-subtitulo">
        Mueve cada imagen a caja correspondiente
      </h2>
    </header>
    <main class="contenedor">
        <p class="tiempo" id="tiempo">0</p>
      <div class="disponibles">
        <div class="contenedor-icono" draggable="true" id="i1" data-tipo="s">
          <img src="images/i1.png" alt="" class="icono" />
        </div>
        <div class="contenedor-icono" draggable="true" id="i2" data-tipo="s">
          <img src="images/i2.png" alt="" class="icono" />
        </div>
        <div class="contenedor-icono" draggable="true" id="i3" data-tipo="s">
          <img src="images/i3.png" alt="" class="icono" />
        </div>
        <div class="contenedor-icono" draggable="true" id="i4" data-tipo="e">
          <img src="images/i4.png" alt="" class="icono" />
        </div>
        <div class="contenedor-icono" draggable="true" id="i5" data-tipo="e">
          <img src="images/i5.png" alt="" class="icono" />
        </div>
        <div class="contenedor-icono" draggable="true" id="i6" data-tipo="e">
          <img src="images/i6.png" alt="" class="icono" />
        </div>
        <div class="contenedor-icono" draggable="true" id="i7" data-tipo="e">
          <img src="images/i7.png" alt="" class="icono" />
        </div>
        <div class="contenedor-icono" draggable="true" id="i8" data-tipo="e">
          <img src="images/i8.png" alt="" class="icono" />
        </div>
        <div class="contenedor-icono" draggable="true" id="i9" data-tipo="e">
          <img src="images/i9.png" alt="" class="icono" />
        </div>
        <div class="contenedor-icono" draggable="true" id="i10" data-tipo="s">
          <img src="images/i10.png" alt="" class="icono" />
        </div>
        <div class="contenedor-icono" draggable="true" id="i11" data-tipo="e">
          <img src="images/i11.png" alt="" class="icono" />
        </div>
        <div class="contenedor-icono" draggable="true" id="i12" data-tipo="s">
          <img src="images/i12.png" alt="" class="icono" />
        </div>
      </div>
      <div class="contenedor-es">
        <div class="entrada">
            <h3 class="es-titulo">Dispositivos de entrada</h3>
        </div>
        <div class="salida">
            <h3 class="es-titulo">Dispositivos de salida</h3>
        </div>
      </div>
      <footer class="pie">
        <!-- max="12" ya que hay 12 imágenes -->
        <progress
          class="progreso"
          id="progreso"
          min="1"
          max="12"
          value="0"
        ></progress>
        <p class="aciertos">Aciertos: <span id="aciertos">0</span></p>
      </footer>
    </main>
    <dialog class="resultado" id="resultado">
        <div class="resultado-contenedor">
            <h2 class="resultado-titulo">Has ganado</h2>
            <p class="resultado-mensaje">Lorem ipsum</p>
            <a href="" class="resultado-cerrar">Cerrar</a>
        </div>
    </dialog>
  </body>
</html>
